# CI workflow - ejemplo práctico del curso de Integración Continua
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - Compilar y Testear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compilar con Maven
        run: mvn compile -f backend/pom.xml --batch-mode
      - name: Ejecutar tests
        run: mvn test -f backend/pom.xml --batch-mode

  frontend:
    name: Frontend - Build y Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar tests
        run: npm test
      - name: Build
        run: npm run build
